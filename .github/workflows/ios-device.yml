name: iOS Device IPA

on:
  push:
    tags: ['ios-device-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare iOS project
        run: |
          npm ci
          npm run www
          npx cap sync ios
          cd ios/App
          pod install
      - name: Archive and export signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/build-ios-device.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GymTracker-device-ipa
          path: ${{ runner.temp }}/gymtracker-export/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/gymtracker-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/gymtracker-signing.p12" "$RUNNER_TEMP/gymtracker-profile.mobileprovision" "$RUNNER_TEMP/gymtracker-profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/gymtracker-ci.mobileprovision"
